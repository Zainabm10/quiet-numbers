<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add • Quiet Numbers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Add Transaction</h1>

    <div class="nav-links">
      <button id="toggleTheme" class="secondary" type="button">Toggle Theme</button>

      <div class="links-row">
        <a href="index.html">Home</a>
        <a href="add.html">Add</a>
        <a href="about.html">About</a>
      </div>
    </div>

    <form id="form">
      <label>
        Title / Description
        <input id="description" type="text" required placeholder="e.g. Lunch, Bus, Salary..." />
      </label>

      <label>
        Category
        <select id="category" required>
          <option value="" disabled selected>Select category...</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Salary</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Type
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </label>

      <label>
        Amount
        <input id="amount" type="number" min="0.01" step="0.01" required placeholder="e.g. 250" />
      </label>

      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button" class="secondary" onclick="window.location.href='index.html'">Cancel</button>
      </div>
    </form>

    <div id="msg" class="message" style="display:none;"></div>
  </div>

  <!-- مهم: هذا اللي بيشغل js -->
  <script type="module" src="js/add.js"></script>
</body>
</html>
