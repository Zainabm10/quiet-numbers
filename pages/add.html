<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Transaction - Quiet Numbers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button id="toggleTheme" type="button">Change mood</button>

    <h1>Add Transaction</h1>

    <div class="nav-links">
      <a href="index.html">← Back to Home</a>
    </div>

    <form id="txForm">
      <p>
        <label>
          Type:
          <select name="type" required>
            <option value="">Choose one</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
      </p>

      <p>
        <label>
          Amount:
          <input type="number" name="amount" step="0.01" />
        </label>
      </p>

      <p>
        <label>
          Category:
          <select name="category">
            <option value="">Choose one</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="rent">Rent</option>
            <option value="fun">Fun</option>
            <option value="salary">Salary</option>
            <option value="scholarship">Scholarship</option>
            <option value="other">Other</option>
          </select>
        </label>
      </p>

      <p>
        <label>
          Description:
          <input type="text" name="description" maxlength="60" />
        </label>
      </p>

      <button type="submit">Save</button>
    </form>

    <!-- رسالة واضحة بعد الحفظ -->
    <div id="saveMessage" class="message" style="display:none;"></div>

    <script src="js/add.js"></script>
  </div>
</body>
</html>
