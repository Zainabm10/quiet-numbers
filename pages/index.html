<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiet Numbers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button id="toggleTheme" type="button">Change mood</button>

    <h1>Quiet Numbers</h1>
    <p class="subtitle">Budget made simple for university life.</p>

    <div class="nav-links">
      <a href="add.html">➕ Add Transaction</a>
    </div>

    <!-- ملخص -->
    <div class="cards">
      <div class="card">
        <div class="card-title">Balance</div>
        <div id="balanceValue" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Total Income</div>
        <div id="incomeValue" class="card-value">0</div>
      </div>

      <div class="card">
        <div class="card-title">Total Expenses</div>
        <div id="expenseValue" class="card-value">0</div>
      </div>
    </div>

    <!-- قائمة معاملات -->
    <h2 class="section-title">Recent Transactions</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Category</th>
            <th>Description</th>
            <th class="right">Amount</th>
          </tr>
        </thead>
        <tbody id="txTableBody">
          <!-- JS will render rows here -->
        </tbody>
      </table>
    </div>

    <button id="clearAll" type="button" class="secondary">Clear All</button>

    <script src="js/add.js"></script>
  </div>
</body>
</html>
